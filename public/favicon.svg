<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <g transform="translate(32, 34)">
    <!-- Wheel Segments -->
    <!-- Segment 1: Cyan -->
    <path d="M 0 0 L 0 -22 A 22 22 0 0 1 22 0 Z" fill="#06b6d4"/>
    <!-- Segment 2: Purple -->
    <path d="M 0 0 L 22 0 A 22 22 0 0 1 0 22 Z" fill="#8b5cf6"/>
    <!-- Segment 3: Pink -->
    <path d="M 0 0 L 0 22 A 22 22 0 0 1 -22 0 Z" fill="#ec4899"/>
    <!-- Segment 4: Amber -->
    <path d="M 0 0 L -22 0 A 22 22 0 0 1 0 -22 Z" fill="#f59e0b"/>

    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>

    <!-- Center Hub -->
    <circle cx="0" cy="0" r="6" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="0" r="2" fill="#38bdf8"/>
  </g>

  <!-- Pointer Needle at top -->
  <polygon points="32,4 27,14 37,14" fill="#f43f5e" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"/>
</svg>
